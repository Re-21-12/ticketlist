# Servicios de DESARROLLO de ticketlistbe. Puertos propios (5433 / 6380) para no chocar con otros
# proyectos locales (p. ej. wallet-api usa 5432 / 6379). Credenciales de desarrollo: no son secretos.
#
#   docker compose up -d        # levanta Postgres + Redis
#   docker compose down         # los apaga (los datos persisten en los volúmenes)
#   docker compose down -v      # + borra los datos
services:
  redis:
    image: redis:7-alpine
    container_name: ticketit-redis
    ports:
      - '6380:6379'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    container_name: ticketit-postgres
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: ticketit
      POSTGRES_PASSWORD: ticketit-dev
      POSTGRES_DB: ticketit
    volumes:
      - ticketit-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ticketit -d ticketit']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ticketit-pgdata:
