@if ($done(); as done) {
  <app-illustration class="auth-art" [$name]="'recovery'" />
  <h1 class="auth-title">Cuenta creada</h1>
  <p class="auth-lead" role="status">
    Listo, <strong>{{ done.email }}</strong> ya puede iniciar sesión. No necesitas confirmar nada por correo.
  </p>
  <nav class="auth-links" aria-label="Siguientes pasos">
    <a routerLink="/sign-in" class="app-link">Iniciar sesión</a>
  </nav>
} @else {
  <h1 class="auth-title">Crear cuenta</h1>
  <p class="auth-lead">Regístrate para crear y seguir tickets. Tu cuenta queda activa al instante.</p>

  <app-dynamic-form
    [$definition]="form"
    [$submitting]="$submitting()"
    [$submitLabel]="'Crear cuenta'"
    [$showClear]="false"
    [$singleColumn]="true"
    ($submitted)="onSubmit($event)"
  />

  <nav class="auth-links" aria-label="Otras opciones de acceso">
    <a routerLink="/sign-in" class="app-link">¿Ya tienes cuenta? Inicia sesión</a>
  </nav>
}
