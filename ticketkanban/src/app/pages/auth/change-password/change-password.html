<app-illustration class="auth-art" [$name]="'security'" />
<h1 class="auth-title">Elige tu contraseña</h1>
<p class="auth-lead">
  Entraste con una contraseña temporal. Por seguridad, escribe esa contraseña como «actual» y elige una propia: es lo único
  que puedes hacer hasta cambiarla.
</p>

<app-dynamic-form
  [$definition]="form"
  [$submitting]="$submitting()"
  [$submitLabel]="'Cambiar contraseña'"
  [$showClear]="false"
  [$singleColumn]="true"
  ($submitted)="onSubmit($event)"
/>

<nav class="auth-links" aria-label="Otras opciones">
  <button type="button" pButton severity="secondary" [text]="true" (click)="signOut()">
    <i pButtonIcon class="pi pi-sign-out" aria-hidden="true"></i>
    <span pButtonLabel>Cerrar sesión</span>
  </button>
</nav>
