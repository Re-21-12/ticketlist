<app-crud-page
  [$illustration]="'sharing'"
  [$heading]="'Relaciones'"
  [$description]="'Quién comparte sus tickets con quién y con qué permisos. Puedes revocar cualquier acceso; el historial se conserva.'"
  [$service]="_service"
  [$config]="config"
>
  <div class="relations-filters" role="group" aria-label="Filtros de relaciones">
    <div class="relations-filter">
      <label for="relations-status">Estado</label>
      <p-select
        inputId="relations-status"
        [options]="statusOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="Todas"
        [showClear]="true"
        [ngModel]="$status() || null"
        (ngModelChange)="setStatus($event)"
        size="small"
      />
    </div>
  </div>
</app-crud-page>
