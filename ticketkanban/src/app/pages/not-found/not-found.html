<section class="not-found" aria-labelledby="not-found-title">
  <app-illustration class="not-found-art" [$name]="'empty'" />
  <h1 id="not-found-title" class="not-found-title">No encontramos esta página</h1>
  <p class="not-found-text">La dirección no existe o cambió de lugar. Revisa que esté bien escrita o vuelve al inicio.</p>
  <a pButton routerLink="/">
    <i pButtonIcon class="pi pi-home" aria-hidden="true"></i>
    <span pButtonLabel>Ir al inicio</span>
  </a>
</section>
