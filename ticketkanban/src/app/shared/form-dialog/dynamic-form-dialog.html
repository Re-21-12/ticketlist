@let data = _config.data!;
@if (data.summary; as summary) {
  <app-summary-card class="dfd-summary" [$card]="summary" />
}
<app-dynamic-form
  [$definition]="data.definition"
  [$initialData]="data.initialData ?? null"
  [$readonlyMode]="data.readonlyMode ?? false"
  [$submitLabel]="data.submitLabel ?? 'Guardar'"
  [$submitting]="data.submitting()"
  [$optionsByField]="data.optionsByField?.() ?? {}"
  ($submitted)="data.onSubmit($event)"
>
  <!-- Alta con evidencia: va en el último paso, antes de «Crear ticket». -->
  @if (data.evidence; as files) {
    <app-evidence-picker
      formExtra
      [$inputId]="'dialog-evidence-input'"
      [$files]="files()"
      ($filesChange)="files.set($event)"
      [$disabled]="data.submitting()"
    />
  }
</app-dynamic-form>
