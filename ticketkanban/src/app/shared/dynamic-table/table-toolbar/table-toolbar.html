<div class="table-toolbar">
  <div class="table-toolbar-search">
    <label [for]="$searchId()" class="sr-only">Buscar</label>
    <input
      pInputText
      type="search"
      [id]="$searchId()"
      placeholder="Buscar…"
      autocomplete="off"
      (input)="onSearchInput($any($event.target).value)"
    />
  </div>
  <div class="table-toolbar-actions">
    <button
      type="button"
      pButton
      severity="secondary"
      [outlined]="true"
      [loading]="$refreshing()"
      (click)="$refresh.emit()"
    >
      <i pButtonIcon class="pi pi-refresh" aria-hidden="true"></i>
      <span pButtonLabel>Refrescar</span>
    </button>
    @if ($canCreate()) {
      <button type="button" pButton (click)="$create.emit()">
        <i pButtonIcon class="pi pi-plus" aria-hidden="true"></i>
        <span pButtonLabel>{{ $createLabel() }}</span>
      </button>
    }
  </div>
</div>
