# ────────────────────────────────────────────────────────────────────────────────────────────────
# Ticketit — PRODUCCIÓN en Dokploy (stack PROPIO e independiente de wallet-api).
#
# Servicios: web (Caddy + SPA) · api (BFF NestJS) · db (Postgres: auditoría persistente) · redis
# (sesiones, rate limit, tokens de un solo uso).
#
# Mismas reglas que docker-compose.dokploy.yml de wallet-api:
#   - SIN traefik propio: Dokploy ya corre el suyo; web/api se unen a la red externa `dokploy-network`.
#   - SIN `ports:`: todo entra por el Traefik de Dokploy (HTTPS + Let's Encrypt).
#   - `api` está en 2 redes (dokploy-network + backend) → `traefik.docker.network=dokploy-network`
#     es OBLIGATORIO o Traefik puede resolver la IP de la red equivocada y `/api` cae en el SPA.
#   - Secretos: archivos en `../files/secrets/` (la carpeta que Dokploy conserva entre redeploys).
#
# Si prefieres UN solo compose con wallet-api (compartiendo Redis y Postgres) ver
# docker-compose.wallet-integration.yml y DOKPLOY.md §4.
# ────────────────────────────────────────────────────────────────────────────────────────────────

services:
  # ── SPA ──────────────────────────────────────────────────────────────────────────────────────
  web:
    image: ghcr.io/re-21-12/ticketlist/web:${WEB_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.ticketit-spa.rule=Host(`${TICKETIT_DOMAIN:?TICKETIT_DOMAIN es obligatorio}`)'
      - 'traefik.http.routers.ticketit-spa.entrypoints=websecure'
      - 'traefik.http.routers.ticketit-spa.middlewares=ticketit-headers'
      - 'traefik.http.routers.ticketit-spa.tls=true'
      - 'traefik.http.routers.ticketit-spa.tls.certresolver=letsencrypt'
      - 'traefik.http.services.ticketit-spa.loadbalancer.server.port=80'
      # HSTS en el borde (Caddy habla http y los navegadores ignoran HSTS por http).
      - 'traefik.http.middlewares.ticketit-headers.headers.stsSeconds=31536000'
      - 'traefik.http.middlewares.ticketit-headers.headers.stsIncludeSubdomains=true'
      - 'traefik.http.middlewares.ticketit-headers.headers.forceSTSHeader=true'
      - 'com.centurylinklabs.watchtower.enable=true'
    read_only: true
    tmpfs:
      - /tmp
      - /data:uid=100,gid=101
      - /config:uid=100,gid=101
    cap_drop: ['ALL']
    cap_add: ['NET_BIND_SERVICE']
    security_opt:
      - 'no-new-privileges:true'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:80/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    networks:
      - dokploy-network

  # ── API (BFF) ────────────────────────────────────────────────────────────────────────────────
  api:
    image: ghcr.io/re-21-12/ticketlist/api:${API_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=dokploy-network'
      - 'traefik.http.routers.ticketit-api.rule=Host(`${TICKETIT_DOMAIN:?TICKETIT_DOMAIN es obligatorio}`) && PathPrefix(`/api`)'
      - 'traefik.http.routers.ticketit-api.entrypoints=websecure'
      - 'traefik.http.routers.ticketit-api.middlewares=ticketit-headers'
      - 'traefik.http.routers.ticketit-api.tls=true'
      - 'traefik.http.routers.ticketit-api.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.ticketit-api.priority=100'
      - 'traefik.http.services.ticketit-api.loadbalancer.server.port=3000'
      - 'traefik.http.services.ticketit-api.loadbalancer.healthcheck.path=/api/health'
      - 'traefik.http.services.ticketit-api.loadbalancer.healthcheck.interval=30s'
      - 'traefik.http.services.ticketit-api.loadbalancer.healthcheck.timeout=3s'
      - 'com.centurylinklabs.watchtower.enable=true'
    environment:
      NODE_ENV: production
      PORT: '3000'
      # Detrás de Traefik: req.ip real y cookie `Secure` (sin esto el rate limit agrupa a todos por la IP del proxy).
      TRUST_PROXY: 'true'
      APP_URL: https://${TICKETIT_DOMAIN:?TICKETIT_DOMAIN es obligatorio}
      CORS_ORIGIN: https://${TICKETIT_DOMAIN:?TICKETIT_DOMAIN es obligatorio}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      DATABASE_URL: postgresql://${DB_USER:-ticketit}:${DB_PASSWORD:?DB_PASSWORD es obligatorio}@db:5432/${DB_NAME:-ticketit}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD es obligatorio}@redis:6379
      REDIS_KEY_PREFIX: 'ticketit:'
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      RATE_LIMIT_GLOBAL_PER_MIN: ${RATE_LIMIT_GLOBAL_PER_MIN:-300}
      # Sin datos de demostración: las cuentas iniciales salen del secreto `ticketit_seed_users` (una por rol).
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      # Secretos como archivos (el entrypoint los exporta): no aparecen en `docker inspect`.
      SESSION_SECRET_FILE: /run/secrets/ticketit_session_secret
      TOTP_ENCRYPTION_KEY_FILE: /run/secrets/ticketit_totp_encryption_key
      # Cuentas iniciales por rol (JSON con sus contraseñas; lo genera deploy/generate-secrets.mjs).
      SEED_USERS_JSON_FILE: /run/secrets/ticketit_seed_users
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ['ALL']
    security_opt:
      - 'no-new-privileges:true'
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
    secrets:
      - ticketit_session_secret
      - ticketit_totp_encryption_key
      - ticketit_seed_users
    networks:
      - dokploy-network
      - backend

  # ── Infraestructura ──────────────────────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: ${DB_USER:-ticketit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatorio}
      POSTGRES_DB: ${DB_NAME:-ticketit}
    volumes:
      - ticketit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-ticketit} -d ${DB_NAME:-ticketit}']
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    init: true
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?REDIS_PASSWORD es obligatorio}', '--appendonly', 'yes']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD es obligatorio}
    volumes:
      - ticketit-redis:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      - backend

  # ── Auto-update de imágenes (GHCR) ───────────────────────────────────────────────────────────
  # Vigila SOLO los contenedores con `com.centurylinklabs.watchtower.enable=true` (--label-enable): web y
  # api lo llevan; db, redis y el stack de Dokploy (traefik, dokploy…) NUNCA, así que jamás los toca.
  # Cada 5 min compara el digest de `:latest` y recrea web/api si hay imagen nueva (publicada por el
  # workflow Docker Publish al fusionar a main). Con tags fijos (`sha-abc1234`) no hay nada que actualizar.
  # `nickfedor/watchtower` es el fork vivo de `containrrr/watchtower` (archivado: su cliente Docker viejo
  # falla con daemons modernos, igual que en wallet-api).
  # ⚠ Si wallet-api YA corre su propio Watchtower en este VPS, NO agregues este: el suyo vigila todo el host
  #   por label y ya cubre a Ticketit. Dos Watchtower se pisan al recrear. (Quita el servicio si es tu caso.)
  # Las imágenes de GHCR son públicas: no hace falta montar un login. Si las vuelves privadas, monta el
  # `config.json` del host (`/root/.docker/config.json:/config.json:ro`) como hace wallet-api.
  watchtower:
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    command: ['--label-enable', '--interval', '300', '--cleanup']
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    networks:
      - backend

# ── Docker Secrets: ruta RELATIVA a `../files/secrets/` (Dokploy conserva `files/` entre redeploys) ──
secrets:
  ticketit_session_secret:
    file: ../files/secrets/ticketit_session_secret
  ticketit_totp_encryption_key:
    file: ../files/secrets/ticketit_totp_encryption_key
  ticketit_seed_users:
    file: ../files/secrets/ticketit_seed_users

volumes:
  ticketit-postgres:
  ticketit-redis:

networks:
  # La creó Dokploy: NUNCA `driver: bridge` acá.
  dokploy-network:
    external: true
  backend:
    driver: bridge
